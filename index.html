<!DOCTYPE html>
<html lang="en">
<head>
	<title>YTV Theater</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8">
	<meta name="description" content="YTV Theater is a JavaScript widget that makes YouTube video playlists easy to view on any website.">

	<link rel="stylesheet" href="css/ytv-theater.css?v=11.27.2026.2"><!-- Required CSS File -->

	<!-- Demo Page Styles -->
	<style>
		body{
			background-color: #22272e;
			margin: 0;
		}
		button{
			display: inline-block;
			box-sizing: border-box;
			border: none;
			border-radius: 5px;
			box-shadow: 0 3px 1px -2px rgba( 0, 0, 0, 0.2 ), 0 2px 2px 0 rgba( 0, 0, 0, 0.14 ), 0 1px 5px 0 rgba( 0, 0, 0, 0.12 );
			outline: none;
			width: 260px;
			height: 60px;
			margin: 20px 0 20px 0;
			background-color :#3390e4;
			color: white;
			font-weight: bold;
			font-size: 24px;
			line-height: 60px;
			cursor: pointer;
		}
		#button-container{
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			width: 100%;
			height: 100%;
			text-align: center;
		}
	</style>
</head>

<body>

	<div id="button-container">
		<button type="button" data-ytv-playlist="Software_Tutorials">Software Tutorials</button>
	</div>

	<!-- Procure Eminence Theater HTML Begins -->
	<div id="pe-theater-shader"></div>
	<div id="pe-theater-video-container">
		<iframe id="pe-theater-youtube-video" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
	</div>
	<div id="pe-theater-controller">
		<select class="pe-theater-video-selector" id="Software_Tutorials">
			<option selected="selected" value="Q6aUbwMpz9k">The GIMP Toolbox Setting Everyone Gets Wrong</option>
			<option value="PyXYDFK22oI">RigidBody Falling Over? This Changes Everything</option>
			<option value="NLi9ZXV6nb0">Grab URL Parameters Instantly with JavaScript</option>
			<option value="VCLPSqmsHZA">Effortlessly Merge CSV Files with Python: Fast Tutorial</option>
			<option value="dGAKBvOyCoE">Your Command Prompt is Too Cluttered | Fix It Now</option>
			<option value="dSviCTb3BG8">Canva Pro Transparent Backgrounds Done Right</option>
			<option value="-19zPAc1kOA">Making 3D Text in Blender the Easy Way | Blender TLDW</option>
			<option value="0xh2e_6bfLs">Master File Merging with This Perl Technique</option>
			<option value="2Ak19oCcxcI">STL Export Scale Wrong? Do This in Blender</option>
			<option value="D5Fs_1eENrw">Create a Perfect Circular Array in Blender Fast!</option>
			<option value="L2ZKzd0jXGU">Never Estimate Again: Accurate Object Measurement in Blender</option>
			<option value="LTpFjmzHiqw">Master These Shortcuts and Own Vertex Sliding in Blender</option>
			<option value="ZJMXaeibfNs">Promise Chains Frustrating You? Not Anymore | Simple JS Tutorial</option>
			<option value="jlHdj0DHCC8">Create Curved Shapes in Blender Without the Headache</option>
			<option value="z5ECUQTV460">Fix the Simple Deform Modifier in Blender!</option>
			<option value="">Invalid Video Example</option>
		</select>
	</div>
	<div id="pe-theater-controller-button">-</div>
	<!-- Procure Eminence Theater HTML Ends -->

	<!-- Deferred Javascript Source Files -->
	<script src="js/ytv-theater.js?v=11.27.2026.2" defer></script> <!-- Required JS File -->
	<!-- End of Deferred Javascript Source Files -->
</body>
</html>
